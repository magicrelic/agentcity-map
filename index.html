<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="复杂系统研究的概念与数学工具：按知识组、专题和概念逐级展开，查看解释、公式及学习资料。">
  <meta name="color-scheme" content="light"><title>复杂系统研究 - 概念与数学工具</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="katex/katex.min.css">
  <link rel="stylesheet" href="style.css?v=ebaddb6bb2c5d4ead274fb9fde1eea3ccae2326ee07bdfe3cd1ffc19638514ef">
  <script type="module" src="app.js?v=ebaddb6bb2c5d4ead274fb9fde1eea3ccae2326ee07bdfe3cd1ffc19638514ef" data-source="data.json?v=ebaddb6bb2c5d4ead274fb9fde1eea3ccae2326ee07bdfe3cd1ffc19638514ef"></script>
</head>
<body>
  <a class="skip" href="#search">跳到概念搜索</a>
  <header class="header">
    <h1>复杂系统研究</h1>
    <div class="search-area">
      <label class="search-box"><span class="sr-only">搜索概念</span><input id="search" type="search" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" placeholder="搜索概念、公式或关键词" autocomplete="off" disabled><button id="clear-search" class="quiet" aria-label="清空搜索" hidden>清空</button></label>
      <div id="search-popover" class="search-popover" hidden>
        <p id="search-status" role="status"></p>
        <div id="search-results" role="listbox" aria-label="搜索结果"></div>
      </div>
    </div>
    <div class="depth-control">
      <div class="depth-heading"><label for="expand-depth">展开层级</label><output id="depth-label" for="expand-depth">1 级 · 知识组</output></div>
      <input id="expand-depth" type="range" min="1" max="3" step="1" value="1" list="depth-stops" aria-controls="outline" aria-valuetext="1 级，知识组" disabled>
      <datalist id="depth-stops"><option value="1"></option><option value="2"></option><option value="3"></option></datalist>
    </div>
  </header>
  <main id="browse" class="workspace" aria-label="概念目录" tabindex="-1">
    <ul id="outline" class="outline" aria-label="知识组与资料来源"></ul>
    <div id="load-error" class="load-error" role="alert" hidden><p>目录暂时无法加载，请重新尝试。</p><button id="retry">重新加载</button></div>
  </main>
  <div id="group-tooltip" class="group-tooltip" role="tooltip" hidden><strong id="group-tooltip-title"></strong><p id="group-tooltip-body"></p></div>
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="detail-top"><span id="detail-group"></span><button id="close-detail" class="quiet" aria-label="关闭概念详情">×</button></div>
    <div id="detail-body" class="detail-body"></div>
    <div class="detail-bottom"><button id="copy-link">复制概念链接</button><span id="copy-status" role="status"></span></div>
  </dialog>
  <noscript>请启用 JavaScript，以展开目录、搜索概念和查看详情。</noscript>
</body>
</html>
