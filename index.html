<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="复杂系统研究的概念与数学工具：从数学基础、动力系统、网络科学到推断、学习和控制的一张交互思维导图。">
  <meta name="color-scheme" content="light"><title>复杂系统研究 - 概念与数学工具</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="katex/katex.min.css">
  <link rel="stylesheet" href="style.css?v=792bf4d607713fe5c172bea85704628eb3748ec15e9c6e044081a771d5275e80">
  <script type="module" src="app.js?v=792bf4d607713fe5c172bea85704628eb3748ec15e9c6e044081a771d5275e80" data-source="data.json?v=792bf4d607713fe5c172bea85704628eb3748ec15e9c6e044081a771d5275e80"></script>
</head>
<body>
  <a class="skip" href="#search">跳到概念搜索</a>
  <header class="header">
    <h1>复杂系统研究</h1>
    <div class="search-area">
      <label class="search-box"><span class="sr-only">搜索概念</span><input id="search" type="search" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" placeholder="搜索概念、公式或关键词" autocomplete="off" disabled><button id="clear-search" class="quiet" aria-label="清空搜索" hidden>清空</button></label>
      <div id="search-popover" class="search-popover" hidden>
        <p id="search-status" role="status"></p>
        <div id="search-results" role="listbox" aria-label="搜索结果"></div>
      </div>
    </div>
    <button id="toggle-all" class="toggle-all" aria-controls="nodes" aria-expanded="false" disabled>展开所有</button>
  </header>
  <main class="workspace">
    <section class="map-area" aria-label="交互思维导图">
      <div id="viewport" tabindex="0" aria-label="导图画布，拖动平移，滚轮缩放；也可使用下方缩放按钮">
        <div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div>
      </div>
      <div class="map-tools" aria-label="画布操作"><button id="overview">全图</button><span></span><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-label" aria-live="off">100%</output><button id="zoom-in" aria-label="放大">＋</button><span></span><button id="fit">适应视图</button></div>
      <div id="load-error" class="load-error" role="alert" hidden><p>导图暂时无法加载，请重新尝试。</p><button id="retry">重新加载</button></div>
    </section>
  </main>
  <div id="group-tooltip" class="group-tooltip" role="tooltip" hidden><strong id="group-tooltip-title"></strong><p id="group-tooltip-body"></p></div>
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="detail-top"><span id="detail-group"></span><button id="close-detail" class="quiet" aria-label="关闭概念详情">×</button></div>
    <div id="detail-body" class="detail-body"></div>
    <div class="detail-bottom"><button id="copy-link">复制概念链接</button><span id="copy-status" role="status"></span></div>
  </dialog>
  <noscript>请启用 JavaScript，以展开导图、搜索概念和查看详情。</noscript>
</body>
</html>
