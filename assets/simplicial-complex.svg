<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-label="两个实心三角面沿共同边bc拼成单纯复形"><rect width="780" height="380" fill="white"/><g font-family="sans-serif" fill="#18364a"><text x="220" y="35" font-size="23" text-anchor="middle">沿公共边拼接</text><text x="600" y="35" font-size="23" text-anchor="middle">按维度列出组成单元</text><polygon points="220,75 80,185 360,185" fill="#e7f0f6" stroke="#245d84" stroke-width="2"/><polygon points="80,185 360,185 220,295" fill="#d7e6f0" stroke="#245d84" stroke-width="2"/><line x1="80" y1="185" x2="360" y2="185" stroke="#245d84" stroke-width="4"/><circle cx="220" cy="75" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="220" y="82" font-size="22" text-anchor="middle">a</text><circle cx="80" cy="185" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="80" y="192" font-size="22" text-anchor="middle">b</text><circle cx="360" cy="185" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="360" y="192" font-size="22" text-anchor="middle">c</text><circle cx="220" cy="295" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="220" y="302" font-size="22" text-anchor="middle">d</text><text x="220" y="146" font-size="19" text-anchor="middle">三角面 abc</text><text x="220" y="241" font-size="19" text-anchor="middle">三角面 bcd</text><text x="600" y="100" font-size="21" text-anchor="middle">4 个顶点：a, b, c, d</text><text x="600" y="157" font-size="21" text-anchor="middle">5 条边：ab, ac, bc,</text><text x="600" y="190" font-size="21" text-anchor="middle">bd, cd</text><text x="600" y="251" font-size="21" text-anchor="middle">2 个面：abc, bcd</text><text x="390" y="354" font-size="20" text-anchor="middle">共同边 bc 只计一次；每个三角面的边和顶点都包含在复形中。</text></g></svg>