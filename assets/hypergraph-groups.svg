<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="两个群组由两条超边表示，节点c同时属于两组"><rect width="780" height="400" fill="white"/><g font-family="sans-serif" fill="#18364a"><ellipse cx="265" cy="158" rx="205" ry="112" fill="#e7f0f6" stroke="#527c9b" stroke-width="2"/><ellipse cx="475" cy="255" rx="155" ry="87" fill="#d7e6f0" fill-opacity=".65" stroke="#527c9b" stroke-width="2" stroke-dasharray="7 5"/><text x="237" y="90" font-size="21" text-anchor="middle">群组 1</text><text x="500" y="317" font-size="21" text-anchor="middle">群组 2</text><circle cx="135" cy="161" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="135" y="168" font-size="22" text-anchor="middle">a</text><circle cx="275" cy="142" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="275" y="149" font-size="22" text-anchor="middle">b</text><circle cx="365" cy="225" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="365" y="232" font-size="22" text-anchor="middle">c</text><circle cx="535" cy="245" r="17" fill="white" stroke="#245d84" stroke-width="2"/><text x="535" y="252" font-size="22" text-anchor="middle">d</text><text x="390" y="377" font-size="22" text-anchor="middle">超边 1 = {a, b, c}　　超边 2 = {c, d}</text></g></svg>