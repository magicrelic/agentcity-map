<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-label="节点反应与边上传输"><rect width="600" height="440" fill="white"/><g font-family="sans-serif"><text x="300" y="32" font-size="24" text-anchor="middle" fill="#193b50">节点反应与边上传输</text><line x1="125" y1="127" x2="300" y2="127" stroke="#28638a" stroke-width="3" /><line x1="300" y1="127" x2="475" y2="127" stroke="#28638a" stroke-width="3" /><circle cx="125" cy="127" r="40" fill="#dbe8f0" stroke="#28638a" stroke-width="2"/><text x="125" y="135" font-size="25" text-anchor="middle" fill="#193b50">x₁</text><circle cx="300" cy="127" r="40" fill="#dbe8f0" stroke="#28638a" stroke-width="2"/><text x="300" y="135" font-size="25" text-anchor="middle" fill="#193b50">x₂</text><circle cx="475" cy="127" r="40" fill="#dbe8f0" stroke="#28638a" stroke-width="2"/><text x="475" y="135" font-size="25" text-anchor="middle" fill="#193b50">x₃</text><text x="300" y="76" font-size="21" text-anchor="middle" fill="#193b50">单位权重：1 — 2 — 3</text><line x1="125" y1="185" x2="125" y2="225" stroke="#28638a" stroke-width="2.3" /><path d="M-8,-4 L0,0 L-8,4" fill="none" stroke="#28638a" stroke-width="2.3" transform="translate(125,225) rotate(90)"/><text x="125" y="264" font-size="23" text-anchor="middle" fill="#193b50">x₁ − x₁³</text><line x1="300" y1="185" x2="300" y2="225" stroke="#28638a" stroke-width="2.3" /><path d="M-8,-4 L0,0 L-8,4" fill="none" stroke="#28638a" stroke-width="2.3" transform="translate(300,225) rotate(90)"/><text x="300" y="264" font-size="23" text-anchor="middle" fill="#193b50">x₂ − x₂³</text><line x1="475" y1="185" x2="475" y2="225" stroke="#28638a" stroke-width="2.3" /><path d="M-8,-4 L0,0 L-8,4" fill="none" stroke="#28638a" stroke-width="2.3" transform="translate(475,225) rotate(90)"/><text x="475" y="264" font-size="23" text-anchor="middle" fill="#193b50">x₃ − x₃³</text><text x="300" y="306" font-size="21" text-anchor="middle" fill="#193b50">节点自身：双稳态反应</text><line x1="55" y1="328" x2="545" y2="328" stroke="#dbe8f0" stroke-width="1" /><text x="300" y="369" font-size="22" text-anchor="middle" fill="#193b50">节点 2 的耦合：κ(x₁ − 2x₂ + x₃)</text><text x="300" y="410" font-size="22" text-anchor="middle" fill="#193b50">总变化率 = 自身反应 + 邻居通量</text></g></svg>